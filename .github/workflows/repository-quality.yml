name: Repository quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check repository structure and Markdown links
        run: python3 scripts/check-repository-structure.py

      - name: Check synthetic HRBP decision brief
        run: python3 scripts/check-hrbp-weekly-decision-brief.py examples/synthetic-hrbp-weekly-decision-brief.md
